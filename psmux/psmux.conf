# psmux configuration - mirrors tmux.conf keybindings
# Deploy to: C:\Users\j4rviscmd\.config\psmux\psmux.conf

# --- Prefix key: Ctrl+t ---
unbind C-b
set-option -g prefix C-t
# Note: repeat-time は psmux 未サポート（unknown option 警告が出るため削除）
#       代わりに bind -r のリピートは psmux のデフォルト挙動に依存する
set-option -g focus-events on

# --- Disable Ctrl+d ---
unbind-key -n C-d

# --- Reload config ---
bind r source-file ~/.config/psmux/psmux.conf \; display "Reloaded!"

# --- Mouse ---
# mouse off: ドラッグ選択・スクロールをpsmuxが横取りしない (ターミナル素の選択/コピーを使う)
# ペイン操作はキーバインド (prefix h/j/k/l, C-h/j/k/l) で代替
# Note: WezTerm配下では psmux wrapper (user_profile.ps1) の時点で VT mouse は既に失われているため、
#   mouse on の実益は Windows Terminal のみだった
set -g mouse off
set -g allow-predictions on

# --- Start window and pane indices at 1 ---
set -g base-index 1
setw -g pane-base-index 1

# --- Vi mode ---
set-window-option -g mode-keys vi

# --- Copy mode (psmux has built-in Windows clipboard) ---
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Window/pane management ---
# Note: -c "#{pane_current_path}/" の末尾 / は必須。
#   psmux は -c の Windows パス末尾コンポーネントを欠落させるバグがあり、
#   / なしでは pane_current_path が壊れ、attached 環境で pane が即時終了する
#   (prefix + % / " で pane が一瞬で1つに戻る現象の原因)。
#   末尾 / で欠落を相殺し、正しいディレクトリで pane を起動する。
#   ※ user_profile.ps1 側で psmux 内の Set-Location をスキップし、この引き継ぎを活かしている。
# 誤爆防止のため prefix c の新規ウィンドウ作成は無効化 (tmux.conf と同じ方針)
unbind c
bind % split-window -h -c "#{pane_current_path}/"
bind '"' split-window -v -c "#{pane_current_path}/"

# 3面レイアウト (Ctrl+t }): 左2行(上下) + 右1列
# 旧デザイン: tmux.conf と同じく `}` で switch-client -T layout し、数字(2/3/4/6)で面数を
#   指定する2段階キー。しかし psmux の switch-client -T は「1回消費」方式でテーブルに留まらず、
#   listen状態が安定しない(意図せぬ面が即時生成される)。tmux 互換のテーブル留まりは
#   psmux 側の実装変更が必要で dotfiles では解決不可のため、prefix } に3面生成を直接バインド。
# -c の末尾 / は psmux の pane_current_path 欠落バグ回避(同上:33-37)
bind-key '}' split-window -h -c "#{pane_current_path}/" \; select-pane -L \; split-window -v -c "#{pane_current_path}/"

# Lazygit (Prefix + g)
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# セッション切替 (Ctrl+t s) - デフォルトの choose-tree を上書き
# Why: choose-tree は各セッションの作業ディレクトリが分からないため、
#      pane_current_path 表示 + fzf プレビューで選択する方式に置き換えている
# Why: tmux.conf と共通のスクリプトを使用(複製しない)。スクリプト内の tmux コマンドは
#      cargo bin の tmux.exe = psmux と同一バイナリで解決されるため修正不要
# Why: bash は絶対パス指定必須。popup はサーバー プロセスの PATH を継承し、そこでの
#      bash は C:\Windows\System32\bash.exe (WSL) に解決される。WSL 内には psmux/fzf が
#      ないため即終了し popup が一瞬で閉じる。Git Bash を絶対パスで起動すれば popup 内でも
#      fzf(tmux/awk/sed/sort も)が解決される(実測済み)
# Why: psmux の display-popup はコマンドを pwsh -NoProfile -Command 経由で実行する
#      (popup.rs create_popup_pane) ため、パス内のスペースは pwsh の & 演算子で処理する
bind s display-popup -E -w 80% -h 70% "& 'C:\Program Files\Git\bin\bash.exe' ~/.config/tmux/scripts/session-switch.sh"

# --- vim-like pane switching ---
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# --- Select pane by number ---
# Note: psmux の select-pane -t :.N は pane-base-index を考慮せず内部0ベースで解釈する(tmux非互換)。
#   pane-base-index 1 でも :.0 が1番目になる。そのため表示のN番目を選ぶよう :.(N-1) にシフト。
#   (Ctrl+t q の表示は pane-base-index 1 で 1,2,3... になるので、bind の 1,2,3... と整合)
#   0 は使用しないため割り当てなし。
bind 1 select-pane -t :.0
bind 2 select-pane -t :.1
bind 3 select-pane -t :.2
bind 4 select-pane -t :.3
bind 5 select-pane -t :.4
bind 6 select-pane -t :.5
bind 7 select-pane -t :.6
bind 8 select-pane -t :.7
bind 9 select-pane -t :.8

# --- Moving window ---
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# --- Resizing pane ---
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

# --- Display ---
set-option -g history-limit 64096
set -sg escape-time 10

# Cursor: block (tofu)
set -g cursor-style block

# Terminal title
# Why: psmux は子プロセスのタイトル変更 (OSC 0/2) を pane title (#T) へ反映しない
#   (本家 tmux は反映する)。#T の初期値はホスト名のため #T 指定ではタイトルが
#   ほぼホスト名固定になる。off にしても子プロセスの OSC は pane で消費され外へ
#   透過しないため Claude Code 等の動的タイトルは不可能。
#   よってカレントディレクトリ名を表示する #{b:pane_current_path} を使用する。
set -g set-titles on
set -g set-titles-string "#{b:pane_current_path}"

# psmux の claude ラッパー注入を無効化
# 理由: psmux が Global:claude を注入すると user_profile.ps1 の claude ラッパーが
#       上書きされ、--effort max が付与されなくなる
# 代わりに user_profile.ps1 で --effort max と --teammate-mode tmux を自前付与する
# 参考: psmux/src/pane.rs:615 のコメント
set -g claude-code-fix-tty off

# --- Warm server (psmux独自機能、本家tmuxには不存在) ---
# Why: new-session を瞬時にするため裏で __warm__ 待機サーバーを pre-spawn し、
#   次回 new-session 時に claim(流用)する。
#   かつて #120 の spawn race で lineage 連鎖が破綻し ~5秒スパイクが発生したため
#   off にしていたが、v3.3.7 で #120 が修正(#444)されたため on に戻す。
# TODO: v3.3.7 で warm 周辺の安定性をしばらく観察し、問題なければ本コメントを簡素化
# 参考: psmux/psmux#120, psmux/psmux#444
set -g warm on

# --- Statusline (Solarized theme) ---
# Note: 軽量版 (%if/#() 禁止の理由は statusline.conf ヘッダに記載)
source-file ~/.config/psmux/statusline.conf

# psmux statusline - Solarized theme (tmux/tmux/statusline.conf の軽量移植)
# Caution: %if と #() は禁止。
#   - %if は描画毎に再評価され pane env 取得が文字入力のたびに走り激重になる
#     (tmux は設定読み込み時に1回だけ評価)
#   - #() は statusline 内にあるだけで文字入力が重くなる(status-interval 15・1個でも再現。
#     公式docsでも #() は未案内の非公式機能)。git状況等のシェル連携は不可。
#     → tmux版のフル機能が必要な場合は WSL/tmux 側を使う
#   上記はいずれも psmux 側の問題のため、dotfilesでは回避運用する

set -g mode-style "fg=#eee8d5,bg=#073642"
set -g message-style "fg=#eee8d5,bg=#073642"
set -g message-command-style "fg=#eee8d5,bg=#073642"

set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#eee8d5"

# Why: tmux版のVSCode terminal検出(status off切替)は %if が必須のため断念。
#   常時表示になる (対比: tmux/statusline.conf のVSCode検出%if)
set -g status on
set -g status-interval 60
set -g status-justify "left"
# Note: psmuxは status-bg 非対応(tmux版の `set -g status-bg "#002b36"` はunknown option警告になるため省略)
#   tmux版の実効背景 #002b36 を status-style のbgへ直書きする
set -g status-style "fg=#586e75,bg=#002b36"
set -g status-left-length "60"
set -g status-right-length "60"

# Status left: session名 + paneパスbasename (ネイティブ書式のみ)
set -g status-left "#[fg=#268bd2, bg=#fdf6e3] #S #[fg=#fdf6e3, bg=#2aa198] #[fg=#002b36, bg=#2aa198] #{b:pane_current_path} "

set -g status-right " "

# Note: psmux は setw -g (set-window-option) が window へ反映されない。set -g で設定する
set -g window-status-activity-style "underscore,fg=#839496,bg=#002b36"
set -g window-status-separator ""
set -g window-status-style "NONE,fg=#839496,bg=#002b36"
set -g window-status-format ' '
set -g window-status-current-format ' '

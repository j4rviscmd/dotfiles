# Ref: https://github.com/craftzdog/dotfiles-public/blob/master/.config/tmux/tmux.conf

# Claude Code等の画像ペーストのためにpassthroughを有効化
# Constraint: set-clipboard はサーバーオプションのため -s での設定が必須。-g だと画像ペースト用のクリップボード連携が有効化されない (commit 700cf3e1)
set -s set-clipboard on
set -g allow-passthrough on

# クライアントがデタッチされたとき、そのセッションに他のクライアントがいなければ kill し、
# 直後に resurrect で即時 save する (tab閉=セッション削除を保存スナップショットへ即反映)
# Why: 旧実装はデタッチ時に kill-server し全セッションが消える問題があったため、セッション単位+残クライアント数チェックに改修した経緯がある (commit 67505f72, 3bbf5fa)
# Why kill後にsave: killのみだと直近のautosave(最大@continuum-save-interval分前)に閉じた
#      セッションが残り、PC再起動時のrestoreで「閉じたはずのタブ」が復元されてしまうため
# Note: 最後のセッションをkillすると tmux server 自体が終了し、後続の save がserver終了と
#       競合して落ちる場合がある (その場合は1つ前のautosaveが残るだけで実害は小さい)
# Note: save.sh への quiet 引数は保存完了メッセージの出力抑止 (引数無しでは標準出力へ
#       メッセージを出す。tmux-resurrect/scripts/save.sh L13,263)。detachの瞬間に
#       メッセージが表示されるのを防ぐため
set-hook -g client-detached "run-shell '\
  if [ \$(tmux list-clients -t \"#{session_name}\" 2>/dev/null | wc -l) -eq 0 ]; then \
    tmux kill-session -t \"#{session_name}\" 2>/dev/null; \
    ~/.local/share/tmux/plugins/tmux-resurrect/scripts/save.sh quiet; \
  fi'"

# Ctrl+dを完全無効化
# Why: C-d誤押しによるシェル/セッション終了を防ぐため。zsh側の IGNOREEOF=10 と同時導入の対策 (commit 5d4265cd)
unbind-key -n C-d

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:Tc"
# Constraint: pbcopy は macOS 専用コマンド。Linux は zsh/.zshrc.linux の alias pbcopy="clip.exe" での代替を想定しているが現状コメントアウト (zsh/.zshrc.linux:72)
# Note: 下記 copy-mode-vi の copy-pipe-and-cancel "pbcopy" も同じ macOS 前提
set -s copy-command 'pbcopy'

unbind C-b
# Why: Space はデフォルトで next-layout に割り当てられており、誤押しでレイアウトが崩れるため無効化 (commit 4ddf7b5)
unbind Space

set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

# lazygit等のXDG準拠ツールが ~/.config を読むよう、tmuxサーバー環境に明示
# (display-popup経由起動時に macOSデフォルト ~/Library/Application Support/ へフォールバックするのを防ぐ)
set-environment -g XDG_CONFIG_HOME "$HOME/.config"

# display-popup は tmuxサーバー環境を引き継ぐため、homebrew製ツール (lazygit等) が
# 解決できるよう homebrew の PATH を保証 (macOS: /opt/homebrew, WSL/Linux: /home/linuxbrew)
# Why: WTプロファイル等が non-login bash でサーバーを起動すると homebrew の PATH が
#      入らず (profile/rc を読まず、brew shellenv の eval は zshrc のみ: zsh/.zshrc.linux:29)、
#      popup内で command not found → popupが一瞬で閉じる (起動元: WindowsTerminal/settings.json:187)
# Note: 初回サーバー起動 (スクリプト経由で PATH 冪等追加済みの環境を継承) 時と
#      prefix r の再読込時に PATH が重複追加されるが、コマンド探索以外への実害なし
# Constraint: ディレクトリ存在チェックは %if でなく if-shell で行うこと。%if は引数を
#      フォーマット評価するため '[ -d ... ]' は常に真になる (実測: tmux 3.6)
if-shell '[ -d /opt/homebrew/bin ]' 'set-environment -g PATH "/opt/homebrew/bin:$PATH"'
if-shell '[ -d /home/linuxbrew/.linuxbrew/bin ]' 'set-environment -g PATH "/home/linuxbrew/.linuxbrew/bin:$PATH"'

# mouse off: ドラッグ選択・スクロールをtmuxが横取りしない (ターミナル素の選択/コピーを使う)
# ペイン操作はキーバインド (prefix h/j/k/l, C-h/j/k/l) で代替
set -g mouse off

# Start window and pane indices at 1
set -g base-index 1
setw -g pane-base-index 1

# Key binds
set-window-option -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# 誤爆防止のため prefix c の新規ウィンドウ作成は無効化
# 新規ウィンドウは `prefix C-t`(デフォルト) や `prefix s` のセッション切替から作成すること
unbind c
bind % split-window -hc "#{pane_current_path}"
bind '"' split-window -vc "#{pane_current_path}"

# レイアウト作成 (Ctrl+t shift+] N) — VSCode の ctrl+t shift+] N と統一
# 旧: `prefix }` 単独(2x2レイアウト)は廃止。`}` 押下後に数字で面数を指定する2段階キー化
bind-key '}' switch-client -T layout

# 2面 (Ctrl+t shift+] 2): 左 + 右
bind-key -T layout '2' split-window -h -c "#{pane_current_path}"

# 3面 (Ctrl+t shift+] 3): 左2行 + 右1行
bind-key -T layout '3' split-window -h -c "#{pane_current_path}" \; select-pane -L \; split-window -v -c "#{pane_current_path}"

# 4面 (Ctrl+t shift+] 4): 左2行 + 右2行
bind-key -T layout '4' split-window -h -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; select-pane -L \; split-window -v -c "#{pane_current_path}"

# 6面 (Ctrl+t shift+] 6): 左2行 + 中2行 + 右2行 (3列×2行)
# select-layout tiled は環境依存で2列×3行になることがあるため、明示的に3列×2行を構築
# (-l 67% / -l 50% で列幅を約1/3ずつに均等化)
bind-key -T layout '6' split-window -h -l 67% -c "#{pane_current_path}" \; split-window -h -l 50% -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; select-pane -L \; split-window -v -c "#{pane_current_path}" \; select-pane -L \; split-window -v -c "#{pane_current_path}"

# Lazygit (Ctrl+t g)
# Why: lazygitの ctrl+t (外部difftool起動) が tmux prefix C-t に横取りされるため、
#      起動中のみprefixを C-\ へ退避するラッパーを挟む (scripts/lazygit-tmux)
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "~/.config/tmux/scripts/lazygit-tmux"

# セッション切替 (Ctrl+t s) - デフォルトの choose-tree を上書き
# Why: choose-tree は各セッションの作業ディレクトリが分からないため、
#      pane_current_path 表示 + fzf プレビューで選択する方式に置き換えている
bind s display-popup -E -w 80% -h 70% "~/.config/tmux/scripts/session-switch.sh"

# Git manual fetch & sync (Ctrl+t n) - refreshes ahead/behind counts in the statusline.
# display-message with an explicit -c target so it shows on the client that pressed the key
# (a bare `tmux display` is ambiguous when multiple clients are attached).
bind n run-shell "MSG=$(~/.config/tmux/scripts/git-status.sh '#{pane_current_path}' --fetch 2>/dev/null); [ -n \"\$MSG\" ] && tmux display-message -c '#{client_name}' \"\$MSG\"; true" \; refresh-client -S

## vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Select pane by number
bind 0 select-pane -t :.0
bind 1 select-pane -t :.1
bind 2 select-pane -t :.2
bind 3 select-pane -t :.3
bind 4 select-pane -t :.4
bind 5 select-pane -t :.5
bind 6 select-pane -t :.6
bind 7 select-pane -t :.7
bind 8 select-pane -t :.8
bind 9 select-pane -t :.9

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Resizing pane
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

set-option -g status-justify "left"

set-option -g history-limit 65536
set -sg escape-time 10

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
# Why: #T(tmuxウィンドウタイトル中継)はpane内シェルの空タイトル送信(zshrc set_win_title)
#      により実質何も流れない。移行前のWezTerm title_formatterと同形式に表示形式を変更:
#      ① 動的タイトルあり(Claude Code等): 「cwdベース名 · 動的タイトル」
#      ② 動的タイトルなし(プロンプト時): 「cwdベース名」のみ
# Note: ホスト名除外には #{host} を使用(#{hostname} は無効変数で空展開される)
set -g set-titles-string "#{?#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}},#{b:pane_current_path},#{b:pane_current_path} · #{pane_title}}"

# クライアント接続時にTERM_PROGRAM環境変数を更新し、statusline表示を切り替え
# Why run-shell経由のスクリプト化: statusline.conf の再読込は set -g status-right を
#      上書きし、tmux-continuum が status-right へ埋め込む autosave フックを消してしまう
#      (continuum README Known Issues)。reload-statusline.sh が再読込後に再埋込して防ぐ
set -ga update-environment " TERM_PROGRAM"
set-hook -g client-attached "run-shell '~/.config/tmux/scripts/reload-statusline.sh'"

# import statusline config (includes colors and status bar settings)
source ~/.config/tmux/statusline.conf

# ============================================================
# tmux-resurrect / tmux-continuum (tmux/setup.sh で ~/.local/share/tmux/plugins へ導入)
# ============================================================
# セッション環境の保存/復元。手動: prefix C-s (save) / prefix C-r (restore)
# PC再起動時は continuum が tmux server 起動時に前回保存内容を自動復元し、
# Ghostty は window-save-state がタブ毎のCWDを復元 → .zshrc が同名セッションへ自動再アタッチ
set -g @resurrect-capture-pane-contents 'on'
# Note: nvim戦略はカレントディレクトリに Session.vim がある場合のみ復元時に `nvim -S` で
#       読み込む (resurrect自身はSession.vimを作らない。作成はnvim側の vim-obsession 等が
#       必要で、現状nvim側未導入のため実質効かないが将来のため有効化)
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
# Why 5分(規定は15分): autosaveの役割は開きっぱなしセッションの経過差分の退避のみ
#      (タブを閉じたタイミングは client-detached フックで即時saveされるため)。
#      5分ならPC突然落ち時の巻き戻り損失を実用上無視できる
set -g @continuum-save-interval '5'
# Constraint: continuum は status-right へ autosave フックを prepend するため、
#             statusline.conf (status-right を上書きする) より後にロードすること
run-shell '~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux'
run-shell '~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux'

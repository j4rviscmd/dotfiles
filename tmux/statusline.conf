# vim: ft=tmux
set -g mode-style "fg=#eee8d5,bg=#073642"

set -g message-style "fg=#eee8d5,bg=#073642"
set -g message-command-style "fg=#eee8d5,bg=#073642"

set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#eee8d5"
set -g pane-border-lines heavy
set -g pane-border-format ''

# VSCode terminal detection (vscode, vscodeee, Coderm)
%if "#{==:#{TERM_PROGRAM},vscode}"
  set -g status off
%else
  set -g status on
%endif
set -g status-interval 3
set -g status-justify "left"

set -g status-style "fg=#586e75,bg=#073642"

set -g status-bg "#002b36"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

# 
set -g status-left "#[fg=#268bd2, bg=#fdf6e3]  #S #[fg=#fdf6e3, bg=#2aa198] #[fg=#002b36, bg=#2aa198] #(echo '#{pane_current_path}' | rev | cut -d'/' -f1-3 | rev) #(test -f '#{pane_current_path}/.git' && printf '\uf1bb' && sed 's|.*/worktrees/||' '#{pane_current_path}/.git')#[fg=#2aa198, bg=#586e75] #[fg=#fdf6e3, bg=#586e75]#(~/.config/tmux/scripts/git-status.sh '#{pane_current_path}') #[default]#[fg=#2aa198, bg=None]"
set -g status-right "#[fg=#839496]#(~/.config/tmux/scripts/glm-usage.sh) #[default]"

setw -g window-status-activity-style "underscore,fg=#839496,bg=#002b36"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#839496,bg=#002b36"
setw -g window-status-format ''
setw -g window-status-current-format ''
